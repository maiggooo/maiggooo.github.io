<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reise-Editor · Maiko's Spiele &amp; Tools</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="../favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,800;1,9..144,400&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="../site.css">
<link rel="stylesheet" href="trips.css">
</head>
<body class="trips editor">
<div id="map" role="region" aria-label="Karte — klicken fügt einen Stopp hinzu"></div>
<aside class="panel" aria-label="Editor">
  <div class="panel-scroll">
    <div class="ed-bar">
      <a class="btn ghost" id="backLink" href="./">← Karte</a>
      <select id="tripSel" aria-label="Reise wählen"></select>
      <button class="btn ghost" id="newTrip">+ Neue Reise</button>
      <button class="sync-state" id="syncState" aria-live="polite" hidden></button>
      <button class="round-btn" id="themeToggle" aria-label="Theme wechseln"><span class="dot" aria-hidden="true"></span><span id="themeLabel" class="sr-only">Dark</span></button>
    </div>
    <div id="ed" class="ed"></div>
  </div>
</aside>
<input type="file" id="fileIn" accept="image/*" multiple hidden>
<input type="file" id="gpxIn" accept=".gpx,application/gpx+xml" hidden>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/full.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script src="../site.js"></script>
<script type="module" src="editor.js"></script>
</body>
</html>
