<meta property="og:description" content="Finger auflegen — der Zufall wählt einen aus.">

<link rel="stylesheet" href="site.css">
<style>



  .mast .brand, .headline {
    text-shadow: 0 0 .45px currentColor, .18px .12px .55px rgba(0,0,0,.10);
  }
  .mast .brand em, .headline em {
    text-shadow: 0 0 .5px currentColor, .3px .2px .8px rgba(200,68,42,.18);
  }





  /* ————————————— CHOOSER ————————————— */
  .chooser-head { padding:28px 0 18px; text-align:center; }
  .headline {
    font-family:'Fraunces', serif; font-weight:800;
    font-size:clamp(44px, 8vw, 84px);
    line-height:.95; letter-spacing:-.02em;
  }
  .headline em { font-style:italic; font-weight:400; color:var(--accent); }

  /* Slider */
  .slider-box {
    max-width:520px; margin:22px auto 0;
    border-top:1px solid var(--rule-soft);
    border-bottom:1px solid var(--rule-soft);
    padding:16px 18px;
    display:grid; grid-template-columns:auto 1fr auto; gap:16px; align-items:center;
  }
  .slider-label {
    font-family:'JetBrains Mono', monospace; font-size:11px;
    letter-spacing:.18em; text-transform:uppercase; color:var(--muted);
    white-space:nowrap;
  }
  .slider-value {
    font-family:'Fraunces', serif; font-weight:800; font-style:italic;
    font-size:32px; color:var(--accent); line-height:1;
    min-width:34px; text-align:right;
  }
  input[type="range"] {
    -webkit-appearance:none; appearance:none;
    width:100%; height:22px; background:transparent; cursor:pointer;
  }
  input[type="range"]::-webkit-slider-runnable-track {
    height:2px; background:var(--rule); border-radius:0;
  }
  input[type="range"]::-moz-range-track {
    height:2px; background:var(--rule); border-radius:0;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance:none; appearance:none;
    width:22px; height:22px; border-radius:50%;
    background:var(--accent); border:2px solid var(--ink);
    box-shadow:2px 2px 0 var(--ink);
    margin-top:-10px; cursor:pointer;
    transition:transform .12s;
  }
  input[type="range"]::-webkit-slider-thumb:active { transform:scale(1.15); }
  input[type="range"]::-moz-range-thumb {
    width:20px; height:20px; border-radius:50%;
    background:var(--accent); border:2px solid var(--ink);
    box-shadow:2px 2px 0 var(--ink); cursor:pointer;
  }

  .stage-wrap {
    margin:18px 0;
    border-top:2px solid var(--rule);
    border-bottom:2px solid var(--rule);
  }
  .stage {
    position:relative; width:100%;
    height:min(70vh, 640px);
    background:
      radial-gradient(circle at 50% 50%, var(--paper-2) 0, var(--paper) 70%);
    overflow:hidden;
    touch-action:none;
    -webkit-user-select:none; user-select:none;
    cursor:crosshair;
  }
  .stage.locked { cursor:default; }

  .stage-hint {
    position:absolute; inset:0;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    text-align:center; padding:20px;
    font-family:'Fraunces', serif; font-style:italic;
    color:var(--muted);
    pointer-events:none;
    transition:opacity .3s ease;
  }
  .stage-hint .big {
    font-size:clamp(28px, 5vw, 44px);
    color:var(--ink-soft); margin-bottom:6px;
  }
  .stage-hint .small {
    font-family:'JetBrains Mono', monospace; font-style:normal;
    font-size:11px; letter-spacing:.22em; text-transform:uppercase;
    color:var(--muted);
  }
  .stage.has-fingers .stage-hint { opacity:0; }

  .stage-status {
    position:absolute; top:14px; left:0; right:0;
    text-align:center;
    font-family:'JetBrains Mono', monospace; font-size:11px;
    letter-spacing:.22em; text-transform:uppercase;
    color:var(--muted); pointer-events:none;
    transition:color .2s ease;
  }
  .stage-status .count { color:var(--ink); font-weight:700; }
  .stage.armed .stage-status { color:var(--accent); }

  /* Finger-Kreise */
  .finger {
    position:absolute; top:0; left:0;
    width:120px; height:120px;
    margin:-60px 0 0 -60px;
    border-radius:50%;
    pointer-events:none;
    display:flex; align-items:center; justify-content:center;
  }
  .finger .core {
    width:64px; height:64px; border-radius:50%;
    background:var(--f-color, var(--accent));
    border:2px solid var(--ink);
    box-shadow:3px 3px 0 var(--ink);
    transition:transform .25s ease;
  }
  /* Rings pulsieren global synchron — Delay wird per JS als negativer
     Wert relativ zu einem Startzeitpunkt gesetzt. */
  .finger .ring {
    position:absolute; inset:0; border-radius:50%;
    border:2px solid var(--f-color, var(--accent));
    opacity:.75;
    animation:idle-pulse 1.6s ease-out infinite;
  }
  .finger .ring.r2 {
    animation:idle-pulse 1.6s ease-out infinite;
    /* zweiter Ring ist relativ zum ersten um halbe Periode versetzt,
       aber alle Finger sind untereinander synchron */
  }
  @keyframes idle-pulse {
    0%   { transform:scale(.55); opacity:.85; }
    100% { transform:scale(1.15); opacity:0; }
  }

  .stage.armed .finger .ring,
  .stage.armed .finger .ring.r2 {
    animation:arm-pulse .9s ease-out infinite;
    border-width:3px;
  }
  @keyframes arm-pulse {
    0%   { transform:scale(.55); opacity:1; }
    100% { transform:scale(1.35); opacity:0; }
  }

  .stage.picking .finger {
    transition:opacity .35s ease, transform .35s ease;
  }
  .stage.picking .finger:not(.chosen) {
    opacity:.12; transform:scale(.6);
  }
  .stage.picking .finger:not(.chosen) .ring { animation:none; opacity:0; }
  .finger.chosen .core {
    animation:chosen-pop .6s cubic-bezier(.34,1.56,.64,1) both;
  }
  .finger.chosen .ring,
  .finger.chosen .ring.r2 {
    animation:chosen-ring 1.4s ease-out infinite !important;
    border-width:3px;
  }
  @keyframes chosen-pop {
    0%   { transform:scale(1); }
    50%  { transform:scale(1.6); }
    100% { transform:scale(1.35); }
  }
  @keyframes chosen-ring {
    0%   { transform:scale(.5);  opacity:1; }
    100% { transform:scale(2.2); opacity:0; }
  }

  /* Auto-Fade-Out nach Auswahl */
  .stage.fading .finger {
    transition:opacity .6s ease, transform .6s ease;
    opacity:0;
    transform:scale(.4);
  }

  /* Controls */
  .controls {
    display:flex; flex-wrap:wrap; gap:10px; justify-content:center;
    padding:16px 0 8px;
  }
  .btn {
    border:1px solid var(--rule); background:var(--paper);
    color:var(--ink); padding:10px 16px;
    font-family:'JetBrains Mono', monospace; font-size:11px;
    letter-spacing:.14em; text-transform:uppercase; font-weight:700;
    cursor:pointer; transition:background .15s, transform .1s, box-shadow .15s;
    box-shadow:3px 3px 0 var(--ink);
  }
  .btn:hover { background:var(--paper-2); transform:translate(-1px,-1px); box-shadow:4px 4px 0 var(--accent); }
  .btn:active { transform:translate(1px,1px); box-shadow:1px 1px 0 var(--ink); }

  @media (max-width:560px) {
    .stage { height:min(65vh, 520px); }
    .finger { width:100px; height:100px; margin:-50px 0 0 -50px; }
    .finger .core { width:56px; height:56px; }
    .slider-value { font-size:26px; }
  }


</style>
</head>
<body>
<div class="wrap">

  <header class="mast">
    <div class="edition left">Vol. I · SS 2026 · Nº 07</div>
    <div class="brand">Maiko<em>'s</em>Tools</div>
    <div class="edition right">
      <button class="toggle" id="themeToggle" aria-label="Theme wechseln">
        <span class="dot" id="themeDot"></span>
        <span id="themeLabel">Dark</span>
      </button>
    </div>
  </header>

  <div class="subhead">
    <a class="back" href="index.html" aria-label="Zurück zur Startseite">
      <span class="arrow">&larr;</span>
      <span>Zurück zur Startseite</span>
    </a>
    <span class="meta">Tool · Finger Chooser</span>
  </div>

  <main>
    <section class="chooser-head">
      <h1 class="headline"><em>Chooser</em></h1>

      <div class="slider-box">
        <span class="slider-label">Auswahl</span>
        <input type="range" id="pickCount" min="1" max="5" step="1" value="1" />
        <span class="slider-value" id="pickValue">1</span>
      </div>
    </section>

    <div class="stage-wrap">
      <div class="stage" id="stage">
        <div class="stage-status" id="stageStatus">
          <span class="count" id="fingerCount">0</span> · Finger
        </div>
        <div class="stage-hint" id="stageHint">
          <div class="big">Finger auflegen …</div>
          <div class="small">Multi-Touch aktiv</div>
        </div>
      </div>
    </div>

    <div class="controls">
      <button class="btn" id="btnReset">Neue Runde</button>
    </div>
  </main>

  <footer class="foot">
    <span>Strauss · Biebergemünd</span>
    <span>© SS 2026 — Editorial edition</span>
  </footer>
</div>

<script src="site.js"></script>
<script>
const $ = sel => document.querySelector(sel);

/* ————————————— Chooser Logic ————————————— */
const stage       = $("#stage");
const stageStatus = $("#stageStatus");
const fingerCount = $("#fingerCount");
const btnReset    = $("#btnReset");
const pickCount   = $("#pickCount");
const pickValue   = $("#pickValue");

const COLORS = [
  "#c8442a", "#2f6b3a", "#1e5f8a", "#a8541a",
  "#7a2e8a", "#c9a227", "#0e8074", "#b03a5b",
  "#405d27", "#5a3f9c"
];
const COUNTDOWN_MS   = 3000;   // Zeit bis Auswahl
const AUTO_RESET_MS  = 3000;   // Zeit nach Auswahl bis Auto-Reset

// Referenz-Zeitpunkt, damit alle Finger die selben Animation-Delays haben
// -> Ringe pulsieren global synchron
const ANIM_EPOCH = performance.now();

let fingers = new Map();  // id -> {el}
let armTimer = null;
let autoResetTimer = null;
let phase = "idle"; // idle | armed | picked

/* Slider */
pickCount.addEventListener("input", () => {
  pickValue.textContent = pickCount.value;
});

function colorForIndex(i) {
  return COLORS[i % COLORS.length];
}
function updateStatus() {
  fingerCount.textContent = fingers.size;
  stage.classList.toggle("has-fingers", fingers.size > 0);
}

/* Sync-Delay relativ zur gemeinsamen Epoche */
function syncDelays(el) {
  const elapsed = (performance.now() - ANIM_EPOCH) / 1000; // s
  const rings = el.querySelectorAll(".ring");
  // r1: exakt in Phase mit Epoche
  rings[0].style.animationDelay = `${-elapsed}s`;
  // r2: um halbe Periode (0.8s) versetzt, aber ebenfalls global synchron
  rings[1].style.animationDelay = `${-(elapsed + 0.8)}s`;
}

function addFinger(id, x, y) {
  if (phase === "picked") return;
  const el = document.createElement("div");
  el.className = "finger";
  const color = colorForIndex(fingers.size);
  el.style.setProperty("--f-color", color);
  el.style.transform = `translate(${x}px, ${y}px)`;
  el.innerHTML = `
    <div class="ring"></div>
    <div class="ring r2"></div>
    <div class="core"></div>
  `;
  stage.appendChild(el);
  syncDelays(el);
  fingers.set(id, { el });
  updateStatus();
  scheduleArm();
}
function moveFinger(id, x, y) {
  const f = fingers.get(id);
  if (!f) return;
  f.el.style.transform = `translate(${x}px, ${y}px)`;
}
function removeFinger(id) {
  const f = fingers.get(id);
  if (!f) return;
  f.el.remove();
  fingers.delete(id);
  updateStatus();
  if (phase !== "picked") {
    if (fingers.size === 0) cancelArm();
    else scheduleArm();
  }
}

function scheduleArm() {
  if (phase === "picked") return;
  cancelArm();
  if (fingers.size < 1) return;
  phase = "armed";
  stage.classList.add("armed");
  armTimer = setTimeout(pickWinners, COUNTDOWN_MS);
}
function cancelArm() {
  clearTimeout(armTimer);
  armTimer = null;
  if (phase === "armed") {
    phase = "idle";
    stage.classList.remove("armed");
  }
}
function pickWinners() {
  if (fingers.size === 0) return;
  phase = "picked";
  stage.classList.remove("armed");
  stage.classList.add("picking", "locked");

  const ids = [...fingers.keys()];
  const n = Math.min(parseInt(pickCount.value, 10) || 1, ids.length);

  // Fisher-Yates
  for (let i = ids.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [ids[i], ids[j]] = [ids[j], ids[i]];
  }
  const chosen = ids.slice(0, n);

  chosen.forEach(id => {
    fingers.get(id).el.classList.add("chosen");
  });

  if (navigator.vibrate) navigator.vibrate([40, 80, 200]);

  // Automatischer Reset nach kurzer Anzeige
  clearTimeout(autoResetTimer);
  autoResetTimer = setTimeout(() => {
    // Erst weich ausblenden …
    stage.classList.add("fading");
    setTimeout(resetRound, 650);
  }, AUTO_RESET_MS);
}

function resetRound() {
  clearTimeout(armTimer);
  clearTimeout(autoResetTimer);
  armTimer = null;
  autoResetTimer = null;
  fingers.forEach(f => f.el.remove());
  fingers.clear();
  stage.classList.remove("armed", "picking", "locked", "has-fingers", "fading");
  phase = "idle";
  updateStatus();
}
btnReset.addEventListener("click", resetRound);

/* ————— Touch Events ————— */
function stagePos(clientX, clientY) {
  const r = stage.getBoundingClientRect();
  return { x: clientX - r.left, y: clientY - r.top };
}

stage.addEventListener("touchstart", (e) => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    const { x, y } = stagePos(t.clientX, t.clientY);
    addFinger("t" + t.identifier, x, y);
  }
}, { passive:false });

stage.addEventListener("touchmove", (e) => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    const { x, y } = stagePos(t.clientX, t.clientY);
    moveFinger("t" + t.identifier, x, y);
  }
}, { passive:false });

function endTouch(e) {
  e.preventDefault();
  if (phase === "picked") return;
  for (const t of e.changedTouches) removeFinger("t" + t.identifier);
}
stage.addEventListener("touchend",    endTouch, { passive:false });
stage.addEventListener("touchcancel", endTouch, { passive:false });

</script>
</body>
</html>
